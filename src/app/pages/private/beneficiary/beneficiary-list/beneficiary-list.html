<div class="wrapper-scroller p-3">
    <p-toast></p-toast>
  <div class="breadcrumb-wrapper mb-3">
    <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" class="max-w-full">
    </p-breadcrumb>
    
  </div>

  <div class="card p-3 mb-3">
    <form [formGroup]="searchForm" class="row g-3">
      <div class="col-md-3">
        <label>Household Number</label>
        <input pInputText class="form-control" formControlName="householdNumber" />
      </div>
      <div class="col-md-3">
        <label>First Name</label>
        <input pInputText class="form-control" formControlName="firstName" />
      </div>
      <div class="col-md-3">
        <label>Middle Name</label>
        <input pInputText class="form-control" formControlName="middleName" />
      </div>
      <div class="col-md-3">
        <label>Last Name</label>
        <input pInputText class="form-control" formControlName="lastName" />
      </div>
      <div class="col-md-3">
        <label>Phone Number</label>
        <input pInputText class="form-control" formControlName="phoneNumber" />
      </div>
      <div class="col-md-3">
        <label>State</label>
        <p-dropdown class="w-100" [options]="states" formControlName="state" optionLabel="name" [showClear]="true"
          placeholder="Select State"></p-dropdown>
      </div>
      <div class="col-md-3">
        <label>County</label>
        <p-dropdown class="w-100" [options]="counties" formControlName="county" optionLabel="name" [showClear]="true"
          placeholder="Select County"></p-dropdown>
      </div>
      <div class="col-md-3">
        <label>Payam</label>
        <p-dropdown class="w-100" [options]="payams" formControlName="payam" optionLabel="name" [showClear]="true"
          placeholder="Select Payam"></p-dropdown>
      </div>
      <div class="col-md-3">
        <label>Boma</label>
        <p-dropdown class="w-100" [options]="bomas" formControlName="boma" optionLabel="name" [showClear]="true"
          placeholder="Select Boma"></p-dropdown>
      </div>
      <div class="col-12 text-end">
        <p-button label="Reset" icon="fas fa-refresh" severity="danger" class="me-2" (onClick)="resetForm()"></p-button>
        <p-button label="Search" icon="fas fa-search" severity="primary" (onClick)="searchBeneficiaries()"></p-button>
      </div>

    </form>
  </div>

  <div class="card mb-3">
    
    <p-table [value]="paginatedBeneficiaries" [scrollable]="true" scrollHeight="55vh"
      [tableStyle]="{ 'min-width': '100%' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Household Number</th>
          <th>Name</th>
          <th>Gender</th>
          <th>Age</th>
          <th>Phone</th>
          <th>State</th>
          <th>County</th>
          <th>Payam</th>
          <th>Boma</th>
          <th class="text-center"> Action</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-b>
        <tr>
          <td>{{ b.householdNumber }}</td>
          <td>{{ getFullName(b) }}</td>
          <td>{{ b.gender }}</td>
          <td>{{ b.age }}</td>
          <td>{{ b.phoneNumber }}</td>
          <td>{{ b.state }}</td>
          <td>{{ b.county }}</td>
          <td>{{ b.payam }}</td>
          <td>{{ b.boma }}</td>
          <td class="text-center">
            <button pButton icon="fas fa-pencil" class="p-button-sm p-button-rounded p-button-info me-2"
              (click)="editBeneficiary(b)" pTooltip="Edit"></button>
            <button pButton icon="fas fa-trash" class="p-button-sm p-button-rounded p-button-danger"
              (click)="deleteBeneficiary(b)" pTooltip="Delete"></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="10" class="text-center">No beneficiaries found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-paginator class="paginator-sticky" [rows]="pageSize" [totalRecords]="beneficiaries.length"
    [rowsPerPageOptions]="[10, 25, 50]" (onPageChange)="onPageChange($event)" [dropdownAppendTo]="'body'"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"></p-paginator>

<p-toast
  position="top-right"
  [autoZIndex]="true"
  [baseZIndex]="100000"
  appendTo="body">
</p-toast>
  <p-confirmDialog [style]="{ width: '450px' }"></p-confirmDialog>
</div>
