<div class="breadcrumb-wrapper">
    <p-breadcrumb class="max-w-full" [model]="items" [home]="home"></p-breadcrumb>
</div>

<div *ngIf="isLoading; else mainContent">

</div>

<ng-template #mainContent>
    <p-tabView>
        <p-tabPanel header="Beneficiary's GEO location">
            <div style="height: calc(100vh - 210px); overflow-y: auto;">
                <form [formGroup]="beneficiaryForm" (ngSubmit)="onSubmit()">
                    <div class="container user-form">
                        <div class="row">
                            <!-- Left: Personal Info -->
                            <div class="col-md-6">
                                <div class="card shadow-sm rounded">
                                    <div class="card-header bg-gray text-black">Personal Information</div>
                                    <div class="card-body text-center">
                                        <img [src]="beneficiaryPhoto" class="img-thumbnail mb-3" height="100" />

                                        <table class="table table-bordered table-sm text-start mb-0">
                                            <tbody>
                                                <tr>
                                                    <th>Application ID</th>
                                                    <td>{{ beneficiaryDetails.applicationId }}</td>
                                                </tr>
                                                <tr>
                                                    <th>Name</th>
                                                    <td>{{ beneficiaryDetails.name }}</td>
                                                </tr>
                                                <tr>
                                                    <th>Age</th>
                                                    <td>{{ beneficiaryDetails.age }}</td>
                                                </tr>
                                                <tr>
                                                    <th>Gender</th>
                                                    <td>{{ beneficiaryDetails.gender }}</td>
                                                </tr>
                                                <tr>
                                                    <th>Phone</th>
                                                    <td>{{ beneficiaryDetails.phone }}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Geo Location -->
                            <div class="col-md-6">
                                <div class="card shadow-sm rounded mt-3 mt-md-0">
                                    <h5 class="card-header">GEO location</h5>
                                    <div class="card-body row g-3">
                                        <div class="col-md-6">
                                            <select class="form-select" formControlName="state">
                                                <option value="">State Name</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <select class="form-select" formControlName="county">
                                                <option value="">County Name</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <select class="form-select" formControlName="payam">
                                                <option value="">Payam Name</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <select class="form-select" formControlName="boma">
                                                <option value="">Boma Name</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <input class="form-control" placeholder="GPS Coordinates (Lat)"
                                                formControlName="gpsLat" readonly />
                                        </div>
                                        <div class="col-md-6">
                                            <input class="form-control" placeholder="GPS Coordinates (Long)"
                                                formControlName="gpsLong" readonly />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- ===== Comment + Approve/Reject ===== -->
                        <div class="card shadow-sm rounded mt-3">
                            <div class="card-header bg-gray text-black">Approval Comment</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="approvalComment" class="form-label">Comment (optional)</label>
                                    <textarea id="approvalComment" class="form-control" rows="4"
                                        formControlName="approvalComment"
                                        placeholder="Write a note for approval/rejection..."></textarea>
                                </div>

                                <div class="d-flex gap-2 justify-content-end">
                                    <button type="button" class="btn btn-outline-danger" (click)="onReject()"
                                        [disabled]="isLoading || isSubmitting">
                                        <i class="fas fa-times me-2"></i>Reject
                                    </button>

                                    <button type="button" class="btn btn-success" (click)="onApprove()"
                                        [disabled]="isLoading || isSubmitting">
                                        <i class="fas fa-check me-2"></i>Approve
                                    </button>
                                </div>
                            </div>
                        </div>
                        <!-- Submit Button -->
                        <div class="mt-3 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary" [disabled]="beneficiaryForm.invalid">
                                <i class="fas fa-save me-2"></i>Update
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </p-tabPanel>
    </p-tabView>
</ng-template>
